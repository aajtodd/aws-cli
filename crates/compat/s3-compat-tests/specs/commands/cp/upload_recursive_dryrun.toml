[test]
name = "upload_recursive_dryrun"
description = "cp --recursive --dryrun walks local dir and prints each file"
tags = ["cp", "upload", "dryrun", "recursive"]

[[setup.buckets]]
name = "{bucket}"

[[setup.files]]
path = "src/a.txt"
content = "aaa"

[[setup.files]]
path = "src/sub/b.txt"
content = "bbb"

[command]
args = ["s3", "cp", "src/", "s3://{bucket}/dst/", "--recursive", "--dryrun"]

[expected]
exit_code = 0

[expected.stdout]
mode = "exact"
value = "(dryrun) upload: src/a.txt to s3://{bucket}/dst/a.txt\n(dryrun) upload: src/sub/b.txt to s3://{bucket}/dst/sub/b.txt\n"

[expected.stderr]
mode = "exact"
value = ""

[[expected.objects]]
key = "dst/a.txt"
exists = false

[[expected.objects]]
key = "dst/sub/b.txt"
exists = false
