[test]
name = "s3_to_s3_recursive_dryrun"
description = "cp --recursive --dryrun S3→S3 lists source objects and prints each"
tags = ["cp", "copy", "dryrun", "recursive", "s3-to-s3"]

[[setup.buckets]]
name = "{bucket}"

[[setup.buckets]]
name = "{bucket-dest}"

[[setup.objects]]
key = "src/a.txt"
content = "aaa"

[[setup.objects]]
key = "src/sub/b.txt"
content = "bbb"

[command]
args = ["s3", "cp", "s3://{bucket}/src/", "s3://{bucket-dest}/dst/", "--recursive", "--dryrun"]

[expected]
exit_code = 0

[expected.stdout]
mode = "exact"
value = "(dryrun) copy: s3://{bucket}/src/a.txt to s3://{bucket-dest}/dst/a.txt\n(dryrun) copy: s3://{bucket}/src/sub/b.txt to s3://{bucket-dest}/dst/sub/b.txt\n"

[expected.stderr]
mode = "exact"
value = ""

[[expected.objects]]
bucket = "{bucket-dest}"
key = "dst/a.txt"
exists = false

[[expected.objects]]
bucket = "{bucket-dest}"
key = "dst/sub/b.txt"
exists = false
