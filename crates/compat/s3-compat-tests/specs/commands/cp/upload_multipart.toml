[test]
name = "upload_multipart"
description = "cp uploads a >8MB file via multipart and produces correct output + object state"
tags = ["cp", "upload", "multipart"]

[[setup.buckets]]
name = "{bucket}"

[[setup.files]]
path = "big.bin"
size = 9437184  # 9 MiB — exceeds 8 MiB multipart threshold

[command]
args = ["s3", "cp", "big.bin", "s3://{bucket}/big.bin"]

[expected]
exit_code = 0

[expected.stdout]
mode = "regex"
value = [
    "^Completed [0-9.]+ [KMG]?i?B/9\\.0 MiB \\([^)]+\\) with 1 file\\(s\\) remaining$",
    "^upload: \\./big\\.bin to s3://\\{bucket\\}/big\\.bin$",
]

[expected.stderr]
mode = "exact"
value = ""

[[expected.objects]]
key = "big.bin"
size = 9437184
content_type = "application/octet-stream"
upload_method = "multipart"
