[test]
name = "upload_single"
description = "cp uploads a local file to S3"
tags = ["cp", "upload"]

[[setup.buckets]]
name = "{bucket}"

[[setup.files]]
path = "hello.txt"
content = "hello world"

[command]
args = ["s3", "cp", "hello.txt", "s3://{bucket}/hello.txt"]

[expected]
exit_code = 0

[expected.stdout]
mode = "regex"
value = [
    "^Completed 11 Bytes/11 Bytes \\([^)]+\\) with 1 file\\(s\\) remaining$",
    "^upload: \\./hello\\.txt to s3://\\{bucket\\}/hello\\.txt$",
]

[[expected.objects]]
key = "hello.txt"
exists = true
content = "hello world"
content_type = "text/plain"
upload_method = "put_object"
