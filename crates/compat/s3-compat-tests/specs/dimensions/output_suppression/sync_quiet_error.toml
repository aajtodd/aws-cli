[test]
name = "sync_quiet_error"
description = "--quiet suppresses all output including errors for sync"
tags = ["sync", "output_suppression"]
target = "prod_only"

[[setup.files]]
path = "syncdir/a.txt"
content = "aaa"

[command]
args = ["s3", "sync", "syncdir", "s3://this-bucket-does-not-exist-compat-test-xyz/syncdir/", "--quiet"]

[expected]
exit_code = 1

[expected.stdout]
mode = "exact"
value = ""

[expected.stderr]
mode = "exact"
value = ""

[source]
refs = ["aws/aws-cli#883", "aws/aws-cli#2848"]
cli_ref = "awscli/customizations/s3/s3handler.py:101"
