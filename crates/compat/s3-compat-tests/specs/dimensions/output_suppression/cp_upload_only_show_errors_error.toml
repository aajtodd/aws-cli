[test]
name = "cp_upload_only_show_errors_error"
description = "--only-show-errors still shows transfer failure on stderr"
tags = ["cp", "output_suppression"]
target = "prod_only"

[[setup.files]]
path = "hello.txt"
content = "hello world"

[command]
args = ["s3", "cp", "hello.txt", "s3://this-bucket-does-not-exist-compat-test-xyz/hello.txt", "--only-show-errors"]

[expected]
exit_code = 1

[expected.stdout]
mode = "exact"
value = ""

[expected.stderr]
mode = "regex"
value = ["^upload failed: \\./hello\\.txt to s3://this-bucket-does-not-exist-compat-test-xyz/hello\\.txt An error occurred \\(NoSuchBucket\\)"]

[source]
refs = ["aws/aws-cli#921", "aws/aws-cli#883"]
cli_ref = "awscli/customizations/s3/s3handler.py:103"
rationale = "#921: --only-show-errors uses OnlyShowErrorsResultPrinter which emits errors to stderr; #883 documented the need to distinguish this from --quiet"
