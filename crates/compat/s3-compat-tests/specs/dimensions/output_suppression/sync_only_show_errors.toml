[test]
name = "sync_only_show_errors"
description = "--only-show-errors suppresses per-file transfer output for sync"
tags = ["sync", "output_suppression"]

[[setup.buckets]]
name = "{bucket}"

[[setup.files]]
path = "syncdir/a.txt"
content = "aaa"

[[setup.files]]
path = "syncdir/b.txt"
content = "bbb"

[command]
args = ["s3", "sync", "syncdir", "s3://{bucket}/syncdir/", "--only-show-errors"]

[expected]
exit_code = 0

[expected.stdout]
mode = "exact"
value = ""

[expected.stderr]
mode = "exact"
value = ""

[[expected.objects]]
key = "syncdir/a.txt"
content = "aaa"

[[expected.objects]]
key = "syncdir/b.txt"
content = "bbb"

[source]
refs = ["aws/aws-cli#921"]
cli_ref = "awscli/customizations/s3/s3handler.py:103"
