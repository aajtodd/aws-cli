[test]
name = "rm_single_only_show_errors"
description = "--only-show-errors suppresses delete confirmation output for rm"
tags = ["rm", "output_suppression"]

[[setup.buckets]]
name = "{bucket}"

[[setup.objects]]
key = "hello.txt"
content = "hello world"

[command]
args = ["s3", "rm", "s3://{bucket}/hello.txt", "--only-show-errors"]

[expected]
exit_code = 0

[expected.stdout]
mode = "exact"
value = ""

[expected.stderr]
mode = "exact"
value = ""

[[expected.objects]]
key = "hello.txt"
exists = false

[source]
refs = ["aws/aws-cli#921"]
cli_ref = "awscli/customizations/s3/s3handler.py:103"
