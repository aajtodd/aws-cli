[test]
name = "binary_extensions"
description = "cp infers image/png content type from .png extension"
tags = ["cp", "upload", "content-type"]

[[setup.buckets]]
name = "{bucket}"

[[setup.files]]
path = "image.png"
size = 100

[command]
args = ["s3", "cp", "./image.png", "s3://{bucket}/image.png"]

[expected]
exit_code = 0

[[expected.objects]]
key = "image.png"
content_type = "image/png"
