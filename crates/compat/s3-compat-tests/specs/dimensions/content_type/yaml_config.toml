[test]
name = "yaml_config"
description = "cp uploads .yaml file — Python does not infer content_type; S3 applies binary/octet-stream default"
tags = ["cp", "upload", "content-type"]
target = "prod_only"

[source]
cli_ref = "awscli/customizations/s3/utils.py:340"
rationale = "Python mimetypes.guess_type() returns None for .yaml on macOS — no ContentType sent. S3 applies binary/octet-stream server-side."

[[setup.buckets]]
name = "{bucket}"

[[setup.files]]
path = "config.yaml"
content = "key: value"

[command]
args = ["s3", "cp", "./config.yaml", "s3://{bucket}/config.yaml"]

[expected]
exit_code = 0

[[expected.objects]]
key = "config.yaml"
content_type = "binary/octet-stream"

[deviation]
behavior = "improved_mime_coverage"
rationale = "Python's mimetypes.guess_type() returns None for .yaml on macOS (no system MIME entry). Our CLI sets text/x-yaml via mime_guess2's compiled-in database — deterministic across platforms."
