[test]
name = "no_extension"
description = "cp uploads file with no extension — no content_type is inferred"
tags = ["cp", "upload", "content-type"]

[[setup.buckets]]
name = "{bucket}"

[[setup.files]]
path = "Makefile"
content = "all:\n\techo hello"

[command]
args = ["s3", "cp", "./Makefile", "s3://{bucket}/Makefile"]

[expected]
exit_code = 0

[[expected.objects]]
key = "Makefile"
exists = true
