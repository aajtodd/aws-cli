[test]
name = "sync_size_only_different_size_transfer"
description = "sync --size-only transfers files when sizes differ, regardless of timestamps"
tags = ["sync", "sync_strategy"]

[[setup.buckets]]
name = "{bucket}"

[[setup.objects]]
key = "file.txt"
content = "short"

[[setup.files]]
path = "src/file.txt"
content = "longer content here"

[command]
args = ["s3", "sync", "src/", "s3://{bucket}/", "--size-only"]

[expected]
exit_code = 0

[expected.stdout]
mode = "regex"
value = [
    "^Completed 19 Bytes/19 Bytes \\([^)]+\\) with 1 file\\(s\\) remaining$",
    "^upload: src/file\\.txt to s3://\\{bucket\\}/file\\.txt$",
]

[expected.stderr]
mode = "exact"
value = ""

[[expected.objects]]
key = "file.txt"
content = "longer content here"

[source]
refs = ["aws/aws-cli#473", "aws/aws-cli#719"]
cli_ref = "awscli/customizations/s3/syncstrategy/sizeonly.py:30"
rationale = "#473 requests --size-only; #719 implements it. SizeOnlySync returns True (should sync) when sizes differ."
