[test]
name = "credential_process_success"
description = "A profile with credential_process runs the external program and uses the credentials it emits as JSON on stdout (Version 1 / AccessKeyId / SecretAccessKey); the resolved credentials are sent to the service"
tags = ["ls", "credential_resolution"]

# Executable credential helper. botocore requires {"Version":1,"AccessKeyId":...,
# "SecretAccessKey":...} on stdout. chmod 0755 so the CLI can exec it.
[[setup.files]]
path = "cred_helper.sh"
content = "#!/bin/sh\necho '{\"Version\": 1, \"AccessKeyId\": \"AKIAIOSFODNN7EXAMPLE\", \"SecretAccessKey\": \"wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY\"}'\n"
permissions = "0755"

[[setup.files]]
path = "aws_config"
content = "[profile proc]\ncredential_process = ./cred_helper.sh\n"

[command]
args = ["s3", "ls", "--profile", "proc"]
env = { "AWS_CONFIG_FILE" = "./aws_config" }

[expected]
exit_code = 254

[expected.stdout]
mode = "exact"
value = ""

# The fake credentials resolve and are sent; the service rejects them. Mock
# returns NotSignedUp, prod returns InvalidAccessKeyId — absorb both. Reaching a
# service auth error (not exit 253/255) proves credential_process produced creds.
[expected.stderr]
mode = "regex"
value = ["^An error occurred \\((InvalidAccessKeyId|NotSignedUp)\\) when calling the ListBuckets operation"]

[source]
refs = ["aws/aws-cli#990"]
cli_ref = "awscli/botocore/credentials.py:1118"
rationale = "ProcessProvider parses Version/AccessKeyId/SecretAccessKey from the helper's stdout; exit 254 (service auth error) proves the emitted credentials were resolved and signed a request, vs exit 253 had the provider produced nothing"
