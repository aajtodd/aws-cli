[test]
name = "aws_credential_file_env_not_honored"
description = "The legacy AWS_CREDENTIAL_FILE environment variable is not honored for credential resolution; only AWS_SHARED_CREDENTIALS_FILE relocates the credentials file. Credentials placed only via AWS_CREDENTIAL_FILE are not found"
tags = ["ls", "credential_resolution"]

# Valid credentials reachable ONLY through the legacy var. The profile exists in
# config (so --profile resolves) but carries no credentials of its own.
[[setup.files]]
path = "legacy_creds"
content = "[testuser]\naws_access_key_id = AKIAIOSFODNN7EXAMPLE\naws_secret_access_key = wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY\n"

[[setup.files]]
path = "aws_config"
content = "[profile testuser]\nregion = us-east-2\n"

[command]
args = ["s3", "ls", "--profile", "testuser"]
env = { "AWS_CONFIG_FILE" = "./aws_config", "AWS_CREDENTIAL_FILE" = "./legacy_creds" }

[expected]
exit_code = 253

[expected.stdout]
mode = "exact"
value = ""

[expected.stderr]
mode = "exact"
value = "\nUnable to locate credentials. You can configure credentials by running \"aws configure\".\n"

[source]
refs = ["aws/aws-cli#1037"]
cli_ref = "awscli/botocore/configprovider.py:61"
rationale = "#1037: AWS_CREDENTIAL_FILE is documented but not honored; the config mapping registers only AWS_SHARED_CREDENTIALS_FILE, so credentials reachable only via the legacy var are never found"
