[test]
name = "credential_process_failure"
description = "When the credential_process program exits non-zero, credential resolution fails with an error that surfaces the program's stderr, rather than falling through to another provider"
tags = ["ls", "credential_resolution"]

# Helper that writes a diagnostic to stderr and exits non-zero.
[[setup.files]]
path = "cred_helper.sh"
content = "#!/bin/sh\necho 'helper boom' >&2\nexit 1\n"
permissions = "0755"

[[setup.files]]
path = "aws_config"
content = "[profile proc]\ncredential_process = ./cred_helper.sh\n"

[command]
args = ["s3", "ls", "--profile", "proc"]
env = { "AWS_CONFIG_FILE" = "./aws_config" }

[expected]
exit_code = 255

[expected.stdout]
mode = "exact"
value = ""

[expected.stderr]
mode = "exact"
value = "\nError when retrieving credentials from custom-process: helper boom\n\n"

[source]
refs = ["aws/aws-cli#990"]
cli_ref = "awscli/botocore/credentials.py:1104"
rationale = "ProcessProvider raises CredentialRetrievalError with the helper's decoded stderr when the process returns non-zero; the failure does not fall through to other providers"
