[test]
name = "profile_incomplete_credentials"
description = "A named profile with aws_access_key_id but no aws_secret_access_key fails with a partial-credentials error rather than silently falling through to another provider"
tags = ["ls", "credential_resolution"]

# The --profile flag makes botocore drop the env credential provider, so the
# harness-injected baseline creds do not mask the incomplete profile. The
# credentials file holds an access key with no secret.
[[setup.files]]
path = "aws_creds"
content = "[testuser]\naws_access_key_id = AKIAIOSFODNN7EXAMPLE\n"

[command]
args = ["s3", "ls", "--profile", "testuser"]
env = { "AWS_SHARED_CREDENTIALS_FILE" = "./aws_creds" }

[expected]
exit_code = 255

[expected.stdout]
mode = "exact"
value = ""

[expected.stderr]
mode = "exact"
value = "\nPartial credentials found in shared-credentials-file, missing: aws_secret_access_key\n"

[source]
refs = ["aws/aws-cli#690"]
cli_ref = "awscli/botocore/credentials.py:1051"
rationale = "#690: an incomplete profile must error, not fall through to other providers; SharedCredentialProvider raises PartialCredentialsError when the secret key is absent"
