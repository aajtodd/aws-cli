[test]
name = "env_aws_secret_key_alias_not_honored"
description = "AWS_SECRET_KEY is not recognized as an alias for AWS_SECRET_ACCESS_KEY; with only AWS_ACCESS_KEY_ID + AWS_SECRET_KEY set, the env provider sees a present access key but a missing secret and fails with a partial-credentials error"
tags = ["ls", "credential_resolution"]

[command]
args = ["s3", "ls"]
# Suppress baseline cred injection so the env layer holds exactly the access key
# plus the (unrecognized) AWS_SECRET_KEY alias — and crucially NOT
# AWS_SECRET_ACCESS_KEY, which the harness would otherwise inject.
default_env = { credentials = false }
env = { "AWS_ACCESS_KEY_ID" = "AKIAIOSFODNN7EXAMPLE", "AWS_SECRET_KEY" = "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY" }

[expected]
exit_code = 255

[expected.stdout]
mode = "exact"
value = ""

[expected.stderr]
mode = "exact"
value = "\nPartial credentials found in env, missing: AWS_SECRET_ACCESS_KEY\n"

[source]
refs = ["aws/aws-cli#97"]
cli_ref = "awscli/botocore/credentials.py:1184"
rationale = "#97 requests AWS_SECRET_KEY be accepted as an alias; v2 EnvProvider maps secret_key only to AWS_SECRET_ACCESS_KEY, so the alias is ignored and a present access key with no recognized secret raises PartialCredentialsError"
