[test]
name = "env_secret_without_access_key_ignored"
description = "AWS_SECRET_ACCESS_KEY without AWS_ACCESS_KEY_ID does not resolve credentials; the env provider is skipped and resolution fails with 'Unable to locate credentials'"
tags = ["ls", "credential_resolution"]

[command]
args = ["s3", "ls"]
# Suppress the harness's baseline cred injection so the env layer holds ONLY the
# secret key — the scenario under test. Without this, the harness injects a
# complete key pair and the scenario cannot exist.
default_env = { credentials = false }
env = { "AWS_SECRET_ACCESS_KEY" = "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY" }

[expected]
exit_code = 253

[expected.stdout]
mode = "exact"
value = ""

[expected.stderr]
mode = "exact"
value = "\nUnable to locate credentials. You can configure credentials by running \"aws configure\".\n"

[source]
refs = ["aws/aws-cli#9561"]
cli_ref = "awscli/botocore/credentials.py:1244"
rationale = "EnvProvider.load reads AWS_ACCESS_KEY_ID first (default ''); an empty access key short-circuits the provider, so a lone AWS_SECRET_ACCESS_KEY never forms a credential and the chain falls through to 'Unable to locate credentials'"
