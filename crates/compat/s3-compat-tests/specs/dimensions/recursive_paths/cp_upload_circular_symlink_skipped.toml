[test]
name = "cp_upload_circular_symlink_skipped"
description = "cp --recursive skips circular symlinks with a warning and exit code 2; objects are not created"
tags = ["cp", "recursive_paths", "recursive"]
platform = ["macos", "linux"]

[[setup.buckets]]
name = "{bucket}"

[[setup.files]]
path = "src/good.txt"
content = "good"

[[setup.files]]
path = "src/loop_a.txt"
symlink_to = "loop_b.txt"

[[setup.files]]
path = "src/loop_b.txt"
symlink_to = "loop_a.txt"

[command]
args = ["s3", "cp", "src/", "s3://{bucket}/", "--recursive"]

[expected]
exit_code = 2

[expected.stdout]
mode = "regex"
value = [
    "^Completed \\d+ Bytes/\\d+ Bytes \\([^)]+\\) with \\d+ file\\(s\\) remaining$",
    "^upload: src/good\\.txt to s3://\\{bucket\\}/good\\.txt$",
]

[expected.stderr]
mode = "regex"
value = [
    "^warning: Skipping file .*/src/loop_a\\.txt\\. File does not exist\\.$",
    "^warning: Skipping file .*/src/loop_b\\.txt\\. File does not exist\\.$",
]

[[expected.objects]]
key = "good.txt"
content = "good"

[[expected.objects]]
key = "loop_a.txt"
exists = false

[[expected.objects]]
key = "loop_b.txt"
exists = false

[source]
refs = ["aws/aws-cli#3709", "aws/aws-cli#3961"]
cli_ref = "awscli/customizations/s3/filegenerator.py:323"
rationale = "#3709 and #3961 report circular-symlink infinite loops; in current v2, os.path.exists (:323) returns False for circular symlinks (the kernel returns ELOOP before resolving), so triggers_warning emits 'File does not exist.' and skips — no infinite traversal."
