[test]
name = "cp_upload_nested_dirs_dotfiles"
description = "cp --recursive uploads nested directories including hidden (dot) files; keys preserve relative path structure"
tags = ["cp", "recursive_paths", "recursive"]

[[setup.buckets]]
name = "{bucket}"

[[setup.files]]
path = "src/top.txt"
content = "top"

[[setup.files]]
path = "src/.hidden"
content = "hid"

[[setup.files]]
path = "src/sub/one.txt"
content = "one"

[[setup.files]]
path = "src/sub/deep/two.txt"
content = "two"

[command]
args = ["s3", "cp", "src/", "s3://{bucket}/", "--recursive"]

[expected]
exit_code = 0

[expected.stdout]
mode = "regex"
value = [
    "^Completed \\d+ Bytes/12 Bytes \\([^)]+\\) with \\d+ file\\(s\\) remaining$",
    "^upload: src/\\.hidden to s3://\\{bucket\\}/\\.hidden$",
    "^upload: src/sub/deep/two\\.txt to s3://\\{bucket\\}/sub/deep/two\\.txt$",
    "^upload: src/sub/one\\.txt to s3://\\{bucket\\}/sub/one\\.txt$",
    "^upload: src/top\\.txt to s3://\\{bucket\\}/top\\.txt$",
]

[expected.stderr]
mode = "exact"
value = ""

[[expected.objects]]
key = ".hidden"
content = "hid"

[[expected.objects]]
key = "sub/deep/two.txt"
content = "two"

[[expected.objects]]
key = "sub/one.txt"
content = "one"

[[expected.objects]]
key = "top.txt"
content = "top"

[source]
cli_ref = "awscli/customizations/s3/filegenerator.py:219"
rationale = "filegenerator.list_files calls os.listdir (filegenerator.py:219), which includes dotfiles with no name-based filtering, and recurses into subdirectories depth-first (:239) in sorted order; the walk includes all regular files regardless of name and preserves nested directory structure."
