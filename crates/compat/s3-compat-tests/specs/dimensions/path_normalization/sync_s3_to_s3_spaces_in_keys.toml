[test]
name = "sync_s3_to_s3_spaces_in_keys"
description = "sync s3→s3 correctly copies keys containing spaces without + mangling"
tags = ["sync", "path_normalization"]
target = "prod_only"

[[setup.buckets]]
name = "{bucket}"

[[setup.buckets]]
name = "{bucket-dest}"

[[setup.objects]]
key = "path/my file.txt"
content = "space_content"

[command]
args = ["s3", "sync", "s3://{bucket}/", "s3://{bucket-dest}/"]

[expected]
exit_code = 0

[expected.stdout]
mode = "regex"
value = [
    "^Completed 13 Bytes/13 Bytes \\([^)]+\\) with 1 file\\(s\\) remaining$",
    "^copy: s3://\\{bucket\\}/path/my file\\.txt to s3://\\{bucket-dest\\}/path/my file\\.txt$",
]

[expected.stderr]
mode = "exact"
value = ""

[[expected.objects]]
bucket = "{bucket-dest}"
key = "path/my file.txt"
content = "space_content"

[source]
refs = ["aws/aws-cli#706"]
rationale = "#706 reported space-to-+ mangling in s3→s3 sync; v2 correctly handles keys with spaces in copy operations without encoding corruption."
