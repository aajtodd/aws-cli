[test]
name = "ls_outpost_bucket_arn_rejected"
description = "ls rejects Outpost bucket ARNs with a specific error directing users to s3control"
tags = ["ls", "path_normalization"]

[[setup.buckets]]
name = "{bucket}"

[command]
args = ["s3", "ls", "s3://arn:aws:s3-outposts:us-east-2:123456789012:outpost/op-12345/bucket/mybucket"]

[expected]
exit_code = 252

[expected.stdout]
mode = "exact"
value = ""

[expected.stderr]
mode = "exact"
value = "\ns3 commands do not support Outpost Bucket ARNs. Use s3control commands instead.\n"

[source]
refs = ["aws/aws-cli#6051", "aws/aws-cli#6055"]
cli_ref = "awscli/customizations/s3/utils.py:210"
rationale = "#6051 and #6055 implemented blocking Outpost bucket ARNs from s3 commands, directing users to s3control instead."
