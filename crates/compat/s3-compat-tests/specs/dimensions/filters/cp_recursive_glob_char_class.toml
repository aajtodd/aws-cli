[test]
name = "cp_recursive_glob_char_class"
description = "fnmatch [seq] matches character class in filter patterns"
tags = ["cp", "filters"]

[[setup.buckets]]
name = "{bucket}"

[[setup.files]]
path = "src/f1.txt"
content = "one"

[[setup.files]]
path = "src/f2.txt"
content = "two"

[[setup.files]]
path = "src/f3.txt"
content = "three"

[[setup.files]]
path = "src/fa.txt"
content = "alpha"

[command]
args = ["s3", "cp", "src/", "s3://{bucket}/dest/", "--recursive", "--exclude", "*", "--include", "f[12].txt"]

[expected]
exit_code = 0

[expected.stdout]
mode = "regex"
value = [
    "^Completed \\d+ Bytes/\\d+ Bytes \\([^)]+\\) with \\d+ file\\(s\\) remaining$",
    "^upload: src/f1\\.txt to s3://\\{bucket\\}/dest/f1\\.txt$",
    "^upload: src/f2\\.txt to s3://\\{bucket\\}/dest/f2\\.txt$",
]

[expected.stderr]
mode = "exact"
value = ""

[[expected.objects]]
key = "dest/f1.txt"
content = "one"

[[expected.objects]]
key = "dest/f2.txt"
content = "two"

[[expected.objects]]
key = "dest/f3.txt"
exists = false

[[expected.objects]]
key = "dest/fa.txt"
exists = false

[source]
cli_ref = "awscli/customizations/s3/filters.py:149"
rationale = "fnmatch.fnmatch interprets [seq] as a character class — [12] matches '1' or '2' only"
