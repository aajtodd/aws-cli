[test]
name = "cp_recursive_exclude_all_include_txt"
description = "cp --recursive --exclude '*' --include '*.txt' uploads only .txt files"
tags = ["cp", "filters"]

[[setup.buckets]]
name = "{bucket}"

[[setup.files]]
path = "src/file.txt"
content = "hello"

[[setup.files]]
path = "src/file.log"
content = "data"

[[setup.files]]
path = "src/sub/deep.txt"
content = "nested"

[[setup.files]]
path = "src/sub/deep.csv"
content = "skip"

[command]
args = ["s3", "cp", "src/", "s3://{bucket}/dest/", "--recursive", "--exclude", "*", "--include", "*.txt"]

[expected]
exit_code = 0

[expected.stdout]
mode = "regex"
value = [
    "^Completed \\d+ Bytes/\\d+ Bytes \\([^)]+\\) with \\d+ file\\(s\\) remaining$",
    "^upload: src/file\\.txt to s3://\\{bucket\\}/dest/file\\.txt$",
    "^upload: src/sub/deep\\.txt to s3://\\{bucket\\}/dest/sub/deep\\.txt$",
]

[expected.stderr]
mode = "exact"
value = ""

[[expected.objects]]
key = "dest/file.txt"
content = "hello"

[[expected.objects]]
key = "dest/sub/deep.txt"
content = "nested"

[[expected.objects]]
key = "dest/file.log"
exists = false

[[expected.objects]]
key = "dest/sub/deep.csv"
exists = false

[source]
refs = ["aws/aws-cli#7330", "aws/aws-cli#4774"]
cli_ref = "awscli/customizations/s3/filters.py:149"
rationale = "#7330 reports a v2.8.1 regression where --exclude was ignored; v2 evaluates patterns left-to-right via fnmatch.fnmatch, so --exclude '*' then --include '*.txt' yields only .txt files"
