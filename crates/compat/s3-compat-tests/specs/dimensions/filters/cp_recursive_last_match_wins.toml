[test]
name = "cp_recursive_last_match_wins"
description = "later --include overrides earlier --exclude for the same file (last-match-wins)"
tags = ["cp", "filters"]

[[setup.buckets]]
name = "{bucket}"

[[setup.files]]
path = "src/app.log"
content = "app"

[[setup.files]]
path = "src/important.log"
content = "critical"

[[setup.files]]
path = "src/data.txt"
content = "data"

[command]
args = ["s3", "cp", "src/", "s3://{bucket}/dest/", "--recursive", "--exclude", "*.log", "--include", "*important*"]

[expected]
exit_code = 0

[expected.stdout]
mode = "regex"
value = [
    "^Completed \\d+ Bytes/\\d+ Bytes \\([^)]+\\) with \\d+ file\\(s\\) remaining$",
    "^upload: src/data\\.txt to s3://\\{bucket\\}/dest/data\\.txt$",
    "^upload: src/important\\.log to s3://\\{bucket\\}/dest/important\\.log$",
]

[expected.stderr]
mode = "exact"
value = ""

[[expected.objects]]
key = "dest/data.txt"
content = "data"

[[expected.objects]]
key = "dest/important.log"
content = "critical"

[[expected.objects]]
key = "dest/app.log"
exists = false

[source]
refs = ["aws/aws-cli#476", "aws/aws-cli#7330"]
cli_ref = "awscli/customizations/s3/filters.py:124"
rationale = "#476 confirms multiple --exclude/--include all applied; the for-loop at :124 iterates patterns in order and the last matching pattern's include/exclude flag wins"
