[test]
name = "cp_recursive_glob_star_crosses_slash"
description = "fnmatch * matches across / path separators in filter patterns"
tags = ["cp", "filters"]

[[setup.buckets]]
name = "{bucket}"

[[setup.files]]
path = "src/top.txt"
content = "top"

[[setup.files]]
path = "src/a/b/c/deep.txt"
content = "deep"

[[setup.files]]
path = "src/a/mid.log"
content = "mid"

[command]
args = ["s3", "cp", "src/", "s3://{bucket}/dest/", "--recursive", "--exclude", "*", "--include", "*.txt"]

[expected]
exit_code = 0

[expected.stdout]
mode = "regex"
value = [
    "^Completed \\d+ Bytes/\\d+ Bytes \\([^)]+\\) with \\d+ file\\(s\\) remaining$",
    "^upload: src/top\\.txt to s3://\\{bucket\\}/dest/top\\.txt$",
    "^upload: src/a/b/c/deep\\.txt to s3://\\{bucket\\}/dest/a/b/c/deep\\.txt$",
]

[expected.stderr]
mode = "exact"
value = ""

[[expected.objects]]
key = "dest/top.txt"
content = "top"

[[expected.objects]]
key = "dest/a/b/c/deep.txt"
content = "deep"

[[expected.objects]]
key = "dest/a/mid.log"
exists = false

[source]
cli_ref = "awscli/customizations/s3/filters.py:149"
rationale = "Python fnmatch.fnmatch uses os.path translated patterns; on POSIX, * translates to '.*' regex (re module), matching across / — unlike shell globbing where * stops at path separators"
