[test]
name = "sync_upload_dryrun"
description = "sync --dryrun local→S3 prints (dryrun) upload: lines and does not upload"
tags = ["sync", "dryrun", "upload"]

[[setup.buckets]]
name = "{bucket}"

[[setup.files]]
path = "src/a.txt"
content = "aaa"

[[setup.files]]
path = "src/b.txt"
content = "bbb"

[command]
args = ["s3", "sync", "src/", "s3://{bucket}/dst/", "--dryrun"]

[expected]
exit_code = 0

[expected.stdout]
mode = "exact"
value = "(dryrun) upload: src/a.txt to s3://{bucket}/dst/a.txt\n(dryrun) upload: src/b.txt to s3://{bucket}/dst/b.txt\n"

[expected.stderr]
mode = "exact"
value = ""

[[expected.objects]]
key = "dst/a.txt"
exists = false

[[expected.objects]]
key = "dst/b.txt"
exists = false

[source]
refs = ["aws/aws-cli#6863"]
cli_ref = "awscli/customizations/s3/s3handler.py:248"
rationale = "#6863 requests dryrun include download estimates; v2 sync --dryrun shows only operation lines without sizes"
