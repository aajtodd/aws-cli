[test]
name = "cp_s3_to_s3_metadata_directive_copy"
description = "cp s3→s3 with --metadata-directive COPY preserves source metadata"
tags = ["cp", "s3_to_s3", "metadata_tags"]
target = "prod_only"

[source]
cli_ref = "awscli/customizations/s3/utils.py:666"
refs = ["aws/aws-cli#2253"]
rationale = "#2253 reported that cp between S3 paths should preserve metadata with --metadata-directive COPY; _set_metadata_directive_param passes 'COPY' to MetadataDirective. prod_only: mock lacks CopyObject (HG-001)."

[[setup.buckets]]
name = "{source}"

[[setup.buckets]]
name = "{dest}"

[[setup.objects]]
bucket = "{source}"
key = "doc.txt"
content = "preserved"
metadata = { "author" = "alice", "dept" = "eng" }

[command]
args = ["s3", "cp", "s3://{source}/doc.txt", "s3://{dest}/doc.txt", "--metadata-directive", "COPY"]

[expected]
exit_code = 0

[[expected.objects]]
bucket = "{dest}"
key = "doc.txt"
content = "preserved"
metadata = { "author" = "alice", "dept" = "eng" }
