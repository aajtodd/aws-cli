[test]
name = "cp_upload_checksum_crc32"
description = "cp upload with --checksum-algorithm CRC32 stores CRC32 checksum"
tags = ["cp", "data_integrity"]

[[setup.buckets]]
name = "{bucket}"

[[setup.files]]
path = "hello.txt"
content = "hello world"

[command]
args = ["s3", "cp", "hello.txt", "s3://{bucket}/hello.txt", "--checksum-algorithm", "CRC32"]

[expected]
exit_code = 0

[expected.stdout]
mode = "regex"
value = [
    "^Completed 11 Bytes/11 Bytes \\([^)]+\\) with 1 file\\(s\\) remaining$",
    "^upload: \\./hello\\.txt to s3://\\{bucket\\}/hello\\.txt$",
]

[expected.stderr]
mode = "exact"
value = ""

[[expected.objects]]
key = "hello.txt"
content = "hello world"
checksum_crc32 = "DUoRhQ=="
checksum_type = "FULL_OBJECT"

[source]
refs = ["aws/aws-cli#8933"]
cli_ref = "awscli/customizations/s3/utils.py:599"
rationale = "#8933 added --checksum-algorithm to high-level s3 commands; CRC32 is one of the 5 supported choices."
