[test]
name = "credentials_file_env_override"
description = "AWS_SHARED_CREDENTIALS_FILE overrides the default ~/.aws/credentials location; credentials from the custom file are sent to the service"
tags = ["ls", "config"]

[[setup.files]]
path = "aws_config"
content = "[profile testuser]\nregion = us-east-2\n"

[[setup.files]]
path = "custom_creds"
content = "[testuser]\naws_access_key_id = AKIAIOSFODNN7EXAMPLE\naws_secret_access_key = wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY\n"

[command]
args = ["s3", "ls", "--profile", "testuser"]
env = { "AWS_CONFIG_FILE" = "./aws_config", "AWS_SHARED_CREDENTIALS_FILE" = "./custom_creds" }

[expected]
exit_code = 254

[expected.stdout]
mode = "exact"
value = ""

[expected.stderr]
mode = "regex"
value = ["^An error occurred \\((InvalidAccessKeyId|NotSignedUp)\\) when calling the ListBuckets operation"]

[source]
refs = ["aws/aws-cli#1445", "aws/aws-cli#2541"]
cli_ref = "awscli/botocore/configprovider.py:59"
rationale = "#1445 and #2541 document AWS_SHARED_CREDENTIALS_FILE; exit 254 (service error) proves credentials from the custom path were resolved and sent, not exit 253 (no credentials found)"
