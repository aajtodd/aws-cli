[test]
name = "credentials_file_section_naming"
description = "Credentials file uses [X] without 'profile' prefix; [profile X] in credentials is not found"
tags = ["ls", "config"]

[[setup.files]]
path = "aws_config"
content = "[profile testuser]\nregion = us-east-2\n"

[[setup.files]]
path = "aws_creds_correct"
content = "[testuser]\naws_access_key_id = AKIAIOSFODNN7EXAMPLE\naws_secret_access_key = wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY\n"

[[setup.files]]
path = "aws_creds_wrong"
content = "[profile testuser]\naws_access_key_id = AKIAIOSFODNN7EXAMPLE\naws_secret_access_key = wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY\n"

[command]
args = ["s3", "ls", "--profile", "testuser"]
env = { "AWS_CONFIG_FILE" = "./aws_config", "AWS_SHARED_CREDENTIALS_FILE" = "./aws_creds_wrong" }

[expected]
exit_code = 253

[expected.stdout]
mode = "exact"
value = ""

[expected.stderr]
mode = "exact"
value = "\nUnable to locate credentials. You can configure credentials by running \"aws configure\".\n"

[source]
refs = ["aws/aws-cli#118", "aws/aws-cli#370"]
cli_ref = "awscli/botocore/configloader.py:214"
rationale = "#118 and #370 document the asymmetry: config file requires [profile X] for non-default profiles, credentials file requires bare [X]"
