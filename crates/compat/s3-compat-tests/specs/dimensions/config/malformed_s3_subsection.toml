[test]
name = "malformed_s3_subsection"
description = "s3= assigned a plain string instead of nested block exits 255 with attribute error"
tags = ["ls", "config"]

[[setup.files]]
path = "aws_config"
content = "[default]\nregion = us-east-2\ns3 = bad_value\n"

[[setup.files]]
path = "aws_creds"
content = "[default]\naws_access_key_id = AKIAIOSFODNN7EXAMPLE\naws_secret_access_key = wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY\n"

[command]
args = ["s3", "ls"]
env = { "AWS_CONFIG_FILE" = "./aws_config", "AWS_SHARED_CREDENTIALS_FILE" = "./aws_creds" }

[expected]
exit_code = 255

[expected.stdout]
mode = "exact"
value = ""

[expected.stderr]
mode = "exact"
value = "\n'str' object has no attribute 'get'\n"

[source]
refs = ["aws/aws-cli#9469"]
cli_ref = "awscli/botocore/configprovider.py:628"
rationale = "#9469 requests a clearer error; v2 still produces \"'str' object has no attribute 'get'\" when s3= is a plain value instead of a nested block"
