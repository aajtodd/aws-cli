[test]
name = "sync_multipart_threshold"
description = "sync uploads a file exceeding the 8 MiB multipart_threshold via multipart"
tags = ["sync", "transfer_defaults", "multipart"]

[[setup.buckets]]
name = "{bucket}"

[[setup.files]]
path = "syncdir/large.bin"
size = 9437184  # 9 MiB — exceeds 8 MiB default multipart_threshold

[command]
args = ["s3", "sync", "syncdir", "s3://{bucket}/"]

[expected]
exit_code = 0

[expected.stdout]
mode = "regex"
value = [
    "^Completed [0-9.]+ [KMG]?i?B/9\\.0 MiB \\([^)]+\\) with 1 file\\(s\\) remaining$",
    "^upload: syncdir/large\\.bin to s3://\\{bucket\\}/large\\.bin$",
]

[expected.stderr]
mode = "exact"
value = ""

[[expected.objects]]
key = "large.bin"
size = 9437184
upload_method = "multipart"

[source]
cli_ref = "awscli/customizations/s3/transferconfig.py:27"
rationale = "The 8 MiB multipart_threshold applies uniformly to all upload paths including sync."
